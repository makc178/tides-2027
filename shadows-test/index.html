<style>
:root{--bg-0:#0A1820;--bg-1:#0F2630;--glow:rgba(64,170,180,0.22);--surface:rgba(255,255,255,0.055);--surface-2:rgba(255,255,255,0.09);--stroke:rgba(255,255,255,0.10);--stroke-2:rgba(255,255,255,0.16);--ink:#F1F6F8;--ink-2:rgba(225,238,243,0.70);--ink-3:rgba(225,238,243,0.46);--teal:#5CCFC6;--teal-2:#A6EAE4;--teal-fill-top:rgba(92,207,198,0.34);--teal-fill-bot:rgba(92,207,198,0.00);--warm:#FFA36C;--warm-soft:rgba(255,163,108,0.16);--warm-edge:rgba(255,163,108,0.55);--night:rgba(2,10,16,0.42);--band:rgba(255,255,255,0.10);--spring:#F3E7C9;--neap:#6E95A0;--conf-high:#6FD8A8;--conf-mid:#F2C66D;--conf-low:#FF8E7C;--grid:rgba(255,255,255,0.07);--card-solid:#14303B;--tabs-solid:#122A34;--chart-bg:rgba(255,255,255,0.025);--tl-row:rgba(255,255,255,0.06);--tl-row-strong:rgba(243,231,201,0.10);--sw-spring:rgba(243,231,201,0.35);--sw-neap:rgba(110,149,160,0.35);--band-legend:rgba(255,255,255,0.25);--neap-ink:#A9C6CE}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg-0);color:var(--ink);font-family:Geist,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 20% -10%,var(--glow),transparent 60%),linear-gradient(180deg,var(--bg-1),var(--bg-0) 70%);min-height:100vh}
.wrap{max-width:1360px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:Geologica,Geist,sans-serif;font-weight:600;font-size:26px;margin:2px 0 0;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:var(--surface);border:1px solid var(--stroke);color:var(--ink-2);white-space:nowrap}
.chips .chip{white-space:normal;max-width:100%}
.chip.warn{background:var(--warm-soft);border-color:var(--warm-edge);color:#FFD2B3}
.chip.up{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.45);color:#FFB4B4}

.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=date],input[type=number]{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--stroke-2);border-radius:12px;padding:8px 10px;color-scheme:dark}
input[type=number]{width:76px;font-family:'Geist Mono',monospace}
button{white-space:nowrap;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--stroke-2);border-radius:12px;padding:8px 12px;cursor:pointer}

button.on{background:rgba(92,207,198,.18);border-color:rgba(92,207,198,.55);color:var(--teal-2)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:10px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:0 0 0 1px var(--stroke-2)}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}.ob input,.scrub input{min-width:0}
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:20px;padding:14px;backdrop-filter:blur(12px)}
.card h2{font-size:15px;font-weight:600;margin:0}
.card .sub{font-size:12.5px;color:var(--ink-3);margin:3px 0 10px;line-height:1.35}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.badge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}

.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fact{background:var(--chart-bg);border:1px solid var(--stroke);border-radius:14px;padding:8px 10px;font-size:13px;color:var(--ink-2);line-height:1.35}

.tlabel{font-family:'Geist Mono',monospace;font-size:13px;color:var(--ink-2);min-width:96px;text-align:right}
svg text{font-family:Geist,sans-serif}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:8px}

.ob{border:1px solid var(--stroke);border-radius:16px;padding:10px;margin-top:10px;background:var(--chart-bg)}
.ob .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.ob .lbl{font-size:12px;color:var(--ink-3);min-width:118px}
.pchips button{padding:4px 9px;font-size:12.5px;border-radius:9px}
.dir button{padding:4px 7px;font-size:12px;min-width:34px;border-radius:9px}
.obhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.del{font-size:12px;padding:4px 9px;color:var(--ink-3)}
.dem{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px;color:var(--ink-2)}
.method{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.45}
.skybox svg{width:100%;max-width:360px;display:block;margin:0 auto}
@media (orientation:landscape) and (max-height:500px){
 .wrap{padding:8px 12px 30px}
 h1{font-size:20px}
 .grid{grid-template-columns:1.35fr 1fr}
 .g-hero{grid-column:1/-1}
 .hero{grid-template-columns:auto minmax(180px,.7fr) 2.3fr;gap:10px}
 .card{padding:10px 12px}
 .badge{width:46px;height:46px;border-radius:14px}
 .st{font-size:18px}
 .facts{grid-column:auto;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
 .fact{padding:6px 8px;font-size:11px}.fact b{font-size:13px}
 .top{margin-bottom:6px}
 .skybox svg{max-width:300px}
}
@media (min-width:1040px){
 .wrap{padding:24px 32px 48px}
 .grid{grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr)}
 .g-hero,.g-tl,.g-xs{grid-column:1}
 .g-sky{grid-column:2;grid-row:1/3}
 .g-ob{grid-column:2;grid-row:3/5}
 .g-tl{grid-row:2}.g-xs{grid-row:3}
 .hero{grid-template-columns:auto 1fr}
}

(function(){

 $('rw').value=st.W;$('rw-pre').innerHTML=C.river_width_presets_m.map(function(p){return '<button data-k="W" data-v="'+p+'" class="'+(p===st.W?'on':'')+'">'+p+'</button>'}).join('');
 var r=river();$('demon').disabled=!(r.dem||r.prof);$('demon').checked=st.dem&&!!(r.dem||r.prof);
 if(r.prof&&smp()){var sm=smp();$('dem-text').textContent=T.dem_prof.replace('{src}','Copernicus GLO-30').replace('{z}',C.bank_zone_m).replace('{l}',Math.round(sm.hp.L.dz)).replace('{r}',Math.round(sm.hp.R.dz))}
 else if(r.dem){var mx=0,ma=0;r.dem.h_tenths_deg.forEach(function(v,a){if(v>mx){mx=v;ma=a}});$('dem-text').textContent=T.dem_on.replace('{src}',r.dem.source_short).replace('{r}',r.dem.radius_m/1000).replace('{m}',fmt(mx/10,1)).replace('{a}',ma)}
 else $('dem-text').textContent=T.dem_off}
function onEdit(e){var t=e.target.closest('[data-k]');if(!t)return;var k=t.dataset.k,i=+t.dataset.i,v=t.dataset.v!==undefined?t.dataset.v:t.value;
 if(e.type==='click'&&t.tagName==='INPUT')return;
 if(k==='W'){st.W=Math.max(1,+v||1)}
 else if(k==='del'){st.obs.splice(i,1)}
 else if(k==='type'){var tp=type(v);st.obs[i]={type:v,h:tp.h,d:tp.d,bearing:st.obs[i].bearing,half_width:tp.half_width}}
 else st.obs[i][k]=Math.max(0,+v||0);
 render()}
$('obs').addEventListener('click',onEdit);$('obs').addEventListener('change',onEdit);$('rw-pre').addEventListener('click',onEdit);$('rw').onchange=onEdit;$('rw').dataset.k='W';
$('add').onclick=function(){var tp=C.types[0];st.obs.push({type:tp.id,h:tp.h,d:tp.d,bearing:0,half_width:tp.half_width});render()};
$('demon').onchange=function(){st.dem=this.checked;render()};

/* ---------- общее ---------- */
var SER=null,KEY='';
function render(fast){
 var key=[st.pi,st.lake?1:0,st.ri,st.span,st.day0,st.W,st.dem,JSON.stringify(st.obs)].join('|');if(key!==KEY){SER=series(st.day0,st.span);KEY=key}
 $('slider').max=st.span*1440;$('slider').step=C.slider_step_min;$('slider').value=st.t;
 $('tlabel').textContent=hm(tsel())+(st.span>1?' · '+dm(tsel()):'');
 $('date').value=ymd(st.day0);
 renderHero(SER);renderTL(SER);renderSky();renderXS(shade(tsel()));if(!fast)renderObs();
 renderPt();$('spans').innerHTML=C.spans.map(function(s,i){return '<button data-s="'+s+'" class="'+(s===st.span?'on':'')+'">'+T.days[i]+'</button>'}).join('')}
function setRiver(i){st.ri=i;var sc=C.scenarios[river().name]||C.scenarios['*'];st.obs=JSON.parse(JSON.stringify(sc));st.dem=true;st.pi=0;st.lake=null;st.gps=null;
 var P_=river().prof;$('km').hidden=!P_;$('gpsbtn').hidden=!P_;if(P_){$('km').innerHTML=P_.samples.map(function(q,j){return '<option value="'+j+'">'+T.km_opt.replace('{km}',fmt(q.km,2))+'</option>'}).join('');st.W=P_.samples[0].edge[0]+P_.samples[0].edge[1]}}
function setPi(j){var P_=river().prof;st.pi=j;st.lake=null;st.W=P_.samples[j].edge[0]+P_.samples[j].edge[1]}
/* GPS: привязка к ближайшей точке оси (centerline через 100 м); если точка в озере — состояние «озеро» */
function snapGPS(lat,lon){var P_=river().prof;if(!P_)return;var best=null,kx=111320*Math.cos(lat*R);
 P_.centerline.forEach(function(q){var d=Math.hypot((q[1]-lon)*kx,(q[0]-lat)*111195);if(!best||d<best.d)best={d:d,q:q}});
 var km=best.q[2],j=0;P_.samples.forEach(function(q,i){if(Math.abs(q.km-km)<Math.abs(P_.samples[j].km-km))j=i});setPi(j);
 st.gps={d:Math.round(best.d),km:km};
 if(best.q[3]>=0){P_.lakes.forEach(function(L){if(km>=L.km_from-0.05&&km<=L.km_to+0.05)st.lake=L});if(!st.lake)st.lake={name:'озеро',km_from:km,km_to:km}}}
function renderPt(){var P_=river().prof;if(!P_){$('gpschip').hidden=true;return}$('km').value=st.pi;
 $('gpschip').hidden=!st.gps;if(st.gps)$('gpschip').textContent=(st.gps.d>C.gps.snap_far_m?T.gps_far:T.gps_chip).replace('{km}',fmt(st.gps.km,1)).replace('{d}',st.gps.d)}
function goNow(){st.day0=midnight(NOW);st.t=Math.round((NOW-st.day0)/60000/C.slider_step_min)*C.slider_step_min;render()}
/* init */
$('title').textContent=C.title;$('eyebrow').textContent=C.eyebrow;$('testchip').textContent=T.test_chip;$('nowbtn').textContent=T.now;
['tl-title','sky-title','sky-sub','xs-title','xs-sub','ob-title','ob-sub','dem-title','method'].forEach(function(id){var k=id.replace('-','_');$(id).textContent=T[k]});
$('w-lbl').textContent=T.river_w;$('add').textContent=T.ob_add;$('minus').textContent=T.minus;$('plus').textContent=T.plus;
$('tl-legend').innerHTML=T.tl_legend.map(function(l){return '<span><i style="background:'+SC[l[0]]+'"></i>'+l[1]+'</span>'}).join('')+'<span><i style="background:#FF6B6B;height:5px"></i>'+T.up_legend+'</span><span><i style="background:'+col('warm')+';height:2px"></i>высота Солнца</span><span><i style="border-top:2px dashed '+col('neap')+';height:0"></i>горизонт по азимуту</span>';
$('sky-legend').innerHTML='<span><i style="background:'+col('warm')+'"></i>'+T.sky_legend[0][1]+'</span><span><i style="border-top:2px dashed '+col('teal-2')+';height:0"></i>'+T.sky_legend[1][1]+'</span><span><i style="border-top:2px dotted '+col('ink-3')+';height:0"></i>'+T.sky_legend[2][1]+'</span><span><i style="background:rgba(110,149,160,.45)"></i>'+T.sky_bank_L+'</span><span><i style="background:rgba(143,214,148,.45)"></i>'+T.sky_bank_R+'</span><span><i style="background:rgba(255,107,107,.35)"></i>'+T.sky_up+'</span>';
$('river').innerHTML=C.rivers.map(function(r,i){return '<option value="'+i+'">'+r.name+'</option>'}).join('');
var ri=0;C.rivers.forEach(function(r,i){if(r.name===(hp.river||C.default_river))ri=i});$('river').value=ri;setRiver(ri);
$('river').onchange=function(){setRiver(+this.value);render()};
$('km').onchange=function(){setPi(+this.value);st.gps=null;render()};$('gpsbtn').textContent=T.gps_btn;
$('gpsbtn').onclick=function(){if(!navigator.geolocation){$('gpschip').hidden=false;$('gpschip').textContent=T.gps_fail;return}
 navigator.geolocation.getCurrentPosition(function(p){snapGPS(p.coords.latitude,p.coords.longitude);render()},function(){$('gpschip').hidden=false;$('gpschip').textContent=T.gps_fail},{timeout:8000})};
$('date').onchange=function(){var t=Date.parse(this.value+'T00:00:00+03:00');if(!isNaN(t)){st.day0=t;render()}};
$('nowbtn').onclick=goNow;
$('slider').oninput=function(){st.t=+this.value;render(true)};
$('minus').onclick=function(){st.t=Math.max(0,st.t-C.nudge_min);render(true)};
$('plus').onclick=function(){st.t=Math.min(st.span*1440,st.t+C.nudge_min);render(true)};
$('spans').onclick=function(e){var b=e.target.closest('[data-s]');if(!b)return;st.span=+b.dataset.s;st.t=Math.min(st.t,st.span*1440);render()};
if(river().prof){if(hp.lat&&hp.lon)snapGPS(+hp.lat,+hp.lon);else if(hp.km){var P_=river().prof,j=0;P_.samples.forEach(function(q,i){if(Math.abs(q.km-hp.km)<Math.abs(P_.samples[j].km-hp.km))j=i});setPi(j)}}
if(hp.span)st.span=+hp.span;if(hp.w)st.W=+hp.w;if(hp.dem==='0')st.dem=false;
if(hp.date){st.day0=Date.parse(hp.date+'T00:00:00+03:00');var tt=(hp.t||'12:00').split(':');st.t=(+tt[0])*60+(+tt[1]);render()}else goNow();
document.documentElement.setAttribute('data-ready','1');
})();
